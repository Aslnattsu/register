<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レジ電卓</title>
    
    <link rel="manifest" href="./manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA登録成功！', reg))
            .catch(err => console.log('PWA登録失敗...', err));
        });
      }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="totalContainer" style="background: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 10px; position: relative;">
    <button onclick="openOtsuriCalc()" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 20px; color: #8e8e93; cursor: pointer; padding: 5px;">
        👛おつり
    </button>
    <div id="totalDisplay" style="text-align: right; font-size: 22px; font-weight: bold; margin-left: 60px;">合計: ¥0</div>
</div>

<div id="cartList"></div>

<div id="otsuriModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 320px; text-align: center;">
        <h3 id="otsuriTitle" style="margin-top: 0;">お釣り計算</h3>
        
        <div style="background: #f2f2f7; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: right;">
            <div style="font-size: 12px; color: #8e8e93;">お預かり金額</div>
            <div id="otsuriAzukari" style="font-size: 20px; font-weight: bold; color: #007aff;">¥0</div>
            <div style="font-size: 12px; color: #8e8e93; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px;">お釣り</div>
            <div id="otsuriResult" style="font-size: 24px; font-weight: bold; color: #ff3b30;">¥0</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;">
            <button class="calc-btn" onclick="pressOtsuriNum(7)" style="padding: 15px; font-size: 18px;">7</button>
            <button class="calc-btn" onclick="pressOtsuriNum(8)" style="padding: 15px; font-size: 18px;">8</button>
            <button class="calc-btn" onclick="pressOtsuriNum(9)" style="padding: 15px; font-size: 18px;">9</button>
            <button class="calc-btn" onclick="pressOtsuriNum(4)" style="padding: 15px; font-size: 18px;">4</button>
            <button class="calc-btn" onclick="pressOtsuriNum(5)" style="padding: 15px; font-size: 18px;">5</button>
            <button class="calc-btn" onclick="pressOtsuriNum(6)" style="padding: 15px; font-size: 18px;">6</button>
            <button class="calc-btn" onclick="pressOtsuriNum(1)" style="padding: 15px; font-size: 18px;">1</button>
            <button class="calc-btn" onclick="pressOtsuriNum(2)" style="padding: 15px; font-size: 18px;">2</button>
            <button class="calc-btn" onclick="pressOtsuriNum(3)" style="padding: 15px; font-size: 18px;">3</button>
            <button class="calc-btn" onclick="pressOtsuriNum(0)" style="padding: 15px; font-size: 18px;">0</button>
            <button class="calc-btn" onclick="pressOtsuriNum('00')" style="padding: 15px; font-size: 16px;">00</button>
            <button class="calc-btn" onclick="clearOtsuriCalc()" style="padding: 15px; font-size: 18px; background: #A88F70; color: white;">C</button>
        </div>

        <button onclick="closeOtsuriModal()" style="width: 100%; padding: 12px; background: #8e8e93; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold;">閉じる</button>
    </div>
</div>

<div id="cartList"></div>

<div id="categoryTabs" class="tab-bar" style="display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px;"></div>
    
<div class="grid" id="buttonGrid"></div>
    
    
    
<div class="admin-controls" style="margin-top: 20px; display: grid; gap: 10px;">
    <button class="action-btn" onclick="addNewProduct()" style="background-color: #78866b;">＋ 新しい商品を追加</button>
    <button class="action-btn" onclick="checkout()" style="background-color: #6f4e37; font-weight: bold; font-size: 16px;">💴 お会計を確定する</button>
    <button class="action-btn" onclick="clearCurrentCart()" style="background-color: #e6dfd3; color: #000;">🛒 今のカートをクリア</button>
    <button class="action-btn" onclick="clearSalesHistory()" style="background-color: #b36b5c;">📊 過去の売上履歴をリセット</button>
</div>


<div class="history" id="historyList">
    <strong>販売履歴</strong>
</div>

<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 id="editTitle">商品名の編集</h3>
        <button class="action-btn" onclick="openNameAndPriceEdit()" style="background-color: #007aff;">名前と価格を変更</button>
        <button class="action-btn" onclick="deleteTargetProduct()" style="background-color: #ff3b30;">この商品を削除</button>
        <button class="action-btn" onclick="closeModal()" style="background-color: #8e8e93;">キャンセル</button>
    </div>
</div>
<div id="calcModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 id="calcTitle">自由入力</h3>
        <div id="calcDisplay" style="font-size: 32px; background: #eee; padding: 10px; margin-bottom: 10px; border-radius: 5px; text-align: right;">0</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <button class="item-btn" onclick="pressNum(7)">7</button>
            <button class="item-btn" onclick="pressNum(8)">8</button>
            <button class="item-btn" onclick="pressNum(9)">9</button>
            <button class="item-btn" onclick="pressNum(4)">4</button>
            <button class="item-btn" onclick="pressNum(5)">5</button>
            <button class="item-btn" onclick="pressNum(6)">6</button>
            <button class="item-btn" onclick="pressNum(1)">1</button>
            <button class="item-btn" onclick="pressNum(2)">2</button>
            <button class="item-btn" onclick="pressNum(3)">3</button>
            <button class="item-btn" onclick="pressNum(0)" style="grid-column: span 2;">0</button>
            <button class="item-btn" onclick="clearCalc()" style="background: #ff3b30;">C</button>
        </div>
        <button class="action-btn" onclick="addCalcAmount()" style="background: #34c759; margin-top: 15px;">確定して追加</button>
        <button class="action-btn" onclick="closeCalc()" style="background: #8e8e93; margin-top: 5px;">閉じる</button>
    </div>
</div>

<div id="categoryModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3 id="categoryModalTitle">カテゴリの操作</h3>
        <button class="action-btn" onclick="openCategoryRename()" style="background-color: #007aff;">名前を変更</button>
        <button class="action-btn" onclick="deleteTargetCategory()" style="background-color: #ff3b30;">このカテゴリを削除</button>
        <button class="action-btn" onclick="closeCategoryModal()" style="background-color: #8e8e93;">キャンセル</button>
    </div>
</div>

<div id="addProductModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 320px; text-align: left;">
        <h3 style="margin-top: 0; text-align: center;">新商品の追加</h3>
        
        <label style="display:block; margin-bottom: 5px; font-weight:bold;">商品名</label>
        <input type="text" id="newProdName" value="商品名称" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">

        <label style="display:block; margin-bottom: 5px; font-weight:bold;">価格 (円)</label>
        <input type="number" id="newProdPrice" value="1000" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">

        <label style="display:block; margin-bottom: 5px; font-weight:bold;">ボタンの色</label>
        <div id="colorPalette" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px;">
            </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="closeAddProductModal()" style="flex: 1; padding: 10px; background: #8e8e93; color: white; border: none; border-radius: 5px; font-weight: bold;">キャンセル</button>
            <button onclick="submitNewProduct()" style="flex: 1; padding: 10px; background: #007aff; color: white; border: none; border-radius: 5px; font-weight: bold;">追加する</button>
        </div>
    </div>
</div>

<button id="syncButton" onclick="syncFailedQueueManual()" style="background-color: #ca9788; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
    🔄 未送信データを送信
</button>

<div id="appVersion" style="text-align: center; color: #8e8e93; font-size: 12px; margin: 20px 0;">
    Version 1.2.2
</div>

    <script src="script.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
